[package]
name = "t4-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
